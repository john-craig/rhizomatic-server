<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ themagraph.id }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero compact">
        <div class="brand">
          <img class="brand-logo" src="/static/rhizoid-logo.webp" alt="Spreading earthmoss rhizoid" />
          <div>
            <p class="eyebrow">Themagraph</p>
            <p class="attribution">Logo: <a href="https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/202210_spreading_earthmoss_rhizoid.svg/960px-202210_spreading_earthmoss_rhizoid.svg.png" rel="noreferrer">Spreading earthmoss rhizoid</a></p>
          </div>
        </div>
        <h1>{{ themagraph.id }}</h1>
        <p class="lede">Created {{ themagraph.created_at }}. Updated {{ themagraph.updated_at }}.</p>
        <p><a href="/">Back to search</a></p>
      </section>

      <section class="panel">
        <h2>Edit</h2>
        <form method="post" action="/ui/themagraphs/{{ themagraph.id }}" class="stack">
          <label for="body">Body</label>
          <textarea id="body" name="body" rows="12">{{ themagraph.body }}</textarea>
          <label for="links">Links</label>
          <input id="links" name="links" type="text" value="{{ links_text }}" />
          <button type="submit">Save</button>
        </form>
      </section>

      <section class="panel">
        <h2>Delete</h2>
        <form method="post" action="/ui/themagraphs/{{ themagraph.id }}/delete">
          <button type="submit" class="danger">Delete themagraph</button>
        </form>
      </section>
    </main>
  </body>
</html>
